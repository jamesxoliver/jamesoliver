<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
$if(description)$
<meta name="description" content="$description$">
$endif$
$if(md)$
<link rel="alternate" type="text/markdown" href="$md$">
$endif$
<style>
body { max-width: 36rem; margin: 2.5rem auto; padding: 0 1.25rem; line-height: 1.5; }
:root { color-scheme: light dark; }
table { border-collapse: collapse; }
td, th { padding: 0.3rem 0.6rem 0.3rem 0; border-bottom: 1px solid #8884; }
pre, math[display="block"] { overflow-x: auto; }
img { max-width: 100%; }
.notes { text-transform: lowercase; }
</style>
</head>
<body>
<nav><a href="../">Home</a></nav>
<h1>$title$</h1>
$if(claim)$
<p class="claim"><em>$claim$</em></p>
$endif$
$body$
$if(doi)$
<hr>
<p class="cite">DOI: <a href="https://doi.org/$doi$">$doi$</a>$if(pdf)$ · <a href="$pdf$">PDF</a>$endif$</p>
$else$
$if(pdf)$
<hr>
<p class="cite"><a href="$pdf$">PDF</a></p>
$endif$
$endif$
</body>
</html>
